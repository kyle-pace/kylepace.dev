<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for /labs/ (public/og-labs.png). Render at 1200x630 (share-card skill).
   Colors are the dark-theme tokens from kp-design; the screenshots come from
   src/assets/projects/ (scripts/screenshot-projects.py). */
@font-face{font-family:A;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
@font-face{font-family:M;src:url("../node_modules/@fontsource/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-400-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;background:#141317;font-family:A;overflow:hidden;position:relative;color:#f3efe8}
.glow{position:absolute;inset:-200px auto auto -200px;width:900px;height:600px;background:radial-gradient(ellipse at center,rgba(139,92,246,.24),transparent 65%)}
.card{position:relative;box-sizing:border-box;width:1200px;height:630px;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between}
.mark{font-family:M;font-size:44px;color:#f3efe8}.mark b{font-weight:400;color:#b9a0ff}
h1{margin:0;font-size:104px;line-height:1.02;letter-spacing:-0.02em;font-weight:700}
.sub{margin:24px 0 0;font-size:34px;line-height:1.3;color:#aaa5b2;max-width:520px}
.names{font-size:28px;color:#aaa5b2;max-width:560px;line-height:1.4}.names b{color:#f3efe8;font-weight:700}
.shots{position:absolute;right:-40px;top:60px;width:560px}
.shot{position:absolute;width:440px;aspect-ratio:16/10;border-radius:18px;overflow:hidden;border:2px solid #2e2b34;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<div class="glow"></div>
<div class="shots">
  <div class="shot" style="left:0;top:0;transform:rotate(-4deg)"><img src="../src/assets/projects/skill-tree.png" alt=""></div>
  <div class="shot" style="left:80px;top:170px;transform:rotate(2deg)"><img src="../src/assets/projects/world-cuisine.png" alt=""></div>
  <div class="shot" style="left:20px;top:330px;transform:rotate(-1deg)"><img src="../src/assets/projects/transit.png" alt=""></div>
</div>
<div class="card">
  <div class="mark">kylepace<b>.dev</b></div>
  <div>
    <h1>Labs</h1>
    <p class="sub">Experiments I make for fun and keep refining.</p>
  </div>
  <div class="names"><b>Career skill tree</b> · <b>World cuisine</b> · <b>Washington transit, live</b></div>
</div>
</body></html>
